version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  service-a:
    build: ./services/service-a
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  service-b:
    build: ./services/service-b
    ports:
      - "3001:3001"
    environment:
      - REDIS_URL=redis://redis:6379
      - METRICS_PORT=3001
    depends_on:
      - redis

  service-c:
    build: ./services/service-c
    ports:
      - "3002:3002"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=3002
    depends_on:
      - redis
