apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/limit-rps: "10"
spec:
  rules:
  - http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: service-a-service
            port:
              number: 3000
      - path: /submit
        pathType: Prefix
        backend:
          service:
            name: service-a-service
            port:
              number: 3000
      - path: /status
        pathType: Prefix
        backend:
          service:
            name: service-a-service
            port:
              number: 3000
