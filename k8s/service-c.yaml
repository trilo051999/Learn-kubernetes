apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-c-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-c
  template:
    metadata:
      labels:
        app: service-c
    spec:
      containers:
      - name: service-c
        image: service-c:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3002
        env:
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_URL
        - name: PORT
          value: "3002"
---
apiVersion: v1
kind: Service
metadata:
  name: service-c-service
  labels:
    app: service-c
spec:
  selector:
    app: service-c
  ports:
  - name: http
    protocol: TCP
    port: 3002
    targetPort: 3002
  type: ClusterIP
