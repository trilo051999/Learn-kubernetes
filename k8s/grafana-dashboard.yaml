        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m"
        ]
      },
      "timezone": "browser",
      "title": "Kubernetes Microservices Monitoring",
      "uid": "microservices-monitor",
      "version": 1
    }
